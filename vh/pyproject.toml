[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "c1-vulnhunter-vh"
version = "0.1.0"
description = "Deterministic, model-free operator CLI for a single VulnHunter scan run."
requires-python = ">=3.12"
license = { text = "Apache-2.0" }

# No runtime dependencies: vh shells out to git and the host's own
# headless command. pytest is needed only for the test suite.
[project.optional-dependencies]
dev = ["pytest", "pytest-cov", "mypy"]

[project.urls]
homepage = "https://github.com/nealbridges/VulnHunter"
upstream = "https://github.com/capitalone/vulnhunter"

[tool.setuptools.packages.find]
where = ["."]
include = ["vh*"]

[tool.coverage.run]
# Scope coverage to this component. Bare `--cov` (as the CI workflow invokes
# it) otherwise measures every -einstalled package the suite imports — the
# vulnhunter_common modules sit at 33-48% under vh's suite, which dragged the
# combined TOTAL to 64.09% and tripped the 65 ratchet. Component-scoped, the
# suite measures 66.67% (2026-10-14) — see .github/workflows/tests.yml.
source = ["vh"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = [
    "integration: touches the real filesystem or local harness skill roots",
]
