name: tests

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  lint:
    name: lint (ruff check + format --check)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: "3.12"
      - name: Install ruff
        run: pip install ruff==0.16.10  # pin: matches root ruff.toml config era
      - name: ruff check
        run: ruff check .
      - name: ruff format --check
        run: ruff format --check .

  pytest:
    name: pytest (${{ matrix.project }}, py${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - project: vulnhunter_common
            python-version: "3.12"
            extras: dev
          - project: vh
            python-version: "3.12"
            extras: dev
          - project: harness
            python-version: "3.12"
            extras: dev
          - project: vulnhunter-agent
            python-version: "3.12"
            extras: dev
          - project: vulnhunter-fix
            python-version: "3.11"
            extras: dev
          - project: vulnhunter-fix
            python-version: "3.12"
            extras: dev
    defaults:
      run:
        working-directory: ${{ matrix.project }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project with dev extras
        run: |
          python -m pip install --upgrade pip
          pip install -e "../vulnhunter_common" -e ".[${{ matrix.extras }}]"

      - name: Run pytest with coverage
        if: matrix.project != 'vulnhunter_common'
        run: |
          pytest -v \
            --cov \
            --cov-report=term \
            --cov-report=xml \
            --junitxml=pytest-report.xml

      - name: Run pytest (contract layer)
        if: matrix.project == 'vulnhunter_common'
        run: pytest -v

      - name: Type-check (vh only; ratchet targets per mypy.ini)
        if: matrix.project == 'vh'
        run: mypy vh

      - name: Upload test artifacts on failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02  # v4
        with:
          name: pytest-${{ matrix.project }}-py${{ matrix.python-version }}
          path: |
            ${{ matrix.project }}/pytest-report.xml
            ${{ matrix.project }}/coverage.xml
          if-no-files-found: ignore
