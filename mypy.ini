# Root mypy configuration for the VulnHunter Python components.
# Plan: product_docs/PYTHON_MODERNIZATION_PLAN.md Phase 0 item 2 (§3.0:
# gradual tightening). CI currently enforces the `vh` package only — the
# smallest surface — via tests.yml; harness/agent/fix are ratchet targets.

[global]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = false
warn_unused_ignores = false
warn_redundant_casts = true
no_implicit_optional = true
# Per-component strictness lands via [mypy-<module>] sections over time.

# vh: the operator CLI — enforced in CI from day one.
[mypy-vh.*]
check_untyped_defs = true
warn_return_any = true
